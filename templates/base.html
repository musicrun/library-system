{% macro csrf() %}<input type="hidden" name="csrf" value="{{ session.csrf }}">{% endmacro %}

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}School library{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='app.js') }}" defer></script></head>
<body><header><strong>School library</strong><nav aria-label="Main navigation">
<a href="/">Checkout</a><a href="/return">Return</a><a href="/register">Register</a><a href="/admin">Admin</a><a href="/loans">History</a><a href="/scan-add">Scan / add</a>
</nav></header><main>
{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}
</main><footer>Local library prototype · One copy per ISBN</footer></body></html>
